name: Fetch sources zip from LimeWire
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet httpx "cryptography>=42"
      - name: Fetch + decrypt zip
        run: |
          python3 tools/limewire_fetch.py \
            "https://limewire.com/d/4MK2j#3GzKbUBJZn" \
            onvo-handoff.zip
      - name: Inspect archive
        run: |
          unzip -l onvo-handoff.zip | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: onvo-sources
          path: onvo-handoff.zip
          retention-days: 14
