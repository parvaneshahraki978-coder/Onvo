<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 🍓 YorozuyaPanel logo: strawberry-milk carton + wooden sign (original art) -->
  <defs>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ec"/>
      <stop offset="1" stop-color="#ffd9e3"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6a3c"/>
      <stop offset="1" stop-color="#6f4525"/>
    </linearGradient>
    <linearGradient id="berry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7b9c"/>
      <stop offset="1" stop-color="#e63946"/>
    </linearGradient>
  </defs>
  <!-- carton body -->
  <path d="M78 96 L178 96 L196 226 Q197 236 187 236 L69 236 Q59 236 60 226 Z" fill="url(#milk)" stroke="#3d2712" stroke-width="7" stroke-linejoin="round"/>
  <!-- carton top fold -->
  <path d="M78 96 L108 52 L188 52 L178 96 Z" fill="#ffc7d6" stroke="#3d2712" stroke-width="7" stroke-linejoin="round"/>
  <path d="M108 52 L128 96" stroke="#3d2712" stroke-width="5" stroke-linecap="round"/>
  <!-- straw -->
  <rect x="158" y="14" width="16" height="62" rx="8" fill="#4aa3ff" stroke="#3d2712" stroke-width="6" transform="rotate(18 166 45)"/>
  <!-- strawberry -->
  <path d="M128 130 C108 130 96 144 98 160 C100 182 114 200 128 200 C142 200 156 182 158 160 C160 144 148 130 128 130 Z" fill="url(#berry)" stroke="#7a1020" stroke-width="6"/>
  <path d="M112 132 L118 118 L126 128 L134 116 L140 128 L148 120 L144 132 Z" fill="#2ec4b6" stroke="#0d5c55" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="118" cy="158" r="3.5" fill="#ffe9b0"/>
  <circle cx="132" cy="150" r="3.5" fill="#ffe9b0"/>
  <circle cx="140" cy="166" r="3.5" fill="#ffe9b0"/>
  <circle cx="124" cy="176" r="3.5" fill="#ffe9b0"/>
  <!-- wooden mini sign -->
  <rect x="52" y="196" width="152" height="34" rx="8" fill="url(#wood)" stroke="#3d2712" stroke-width="6"/>
  <text x="128" y="221" text-anchor="middle" font-family="serif" font-weight="900" font-size="20" fill="#f4d35e" letter-spacing="4">万事屋</text>
</svg>
