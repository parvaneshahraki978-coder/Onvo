name: Build Onvo

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------
  # Cross-compile the Rust tunnel core and the C desync engine with the NDK.
  # Both ship inside the APK as lib*.so because nativeLibraryDir is the only
  # place Android still allows exec from.
  # ---------------------------------------------------------------------
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust: aarch64-linux-android
            cc: aarch64-linux-android24-clang
          - abi: armeabi-v7a
            rust: armv7-linux-androideabi
            cc: armv7a-linux-androideabi24-clang
          - abi: x86_64
            rust: x86_64-linux-android
            cc: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Aether + quiche
        run: |
          git clone --depth 1 https://github.com/CluvexStudio/Aether.git ext/Aether
          git clone --depth 1 --recursive https://github.com/cloudflare/quiche.git ext/Aether/quiche

      - name: Checkout ByeDPI
        run: git clone --depth 1 https://github.com/hufrea/byedpi.git ext/byedpi

      # The tun<->SOCKS bridge. Without this the tun device is created but
      # nothing ever moves packets into the proxy, so every attempt fails
      # verification no matter which strategy the brain picks.
      - name: Checkout hev-socks5-tunnel
        run: |
          git clone --depth 1 --recursive \
            https://github.com/heiher/hev-socks5-tunnel.git ext/hev-socks5-tunnel

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: lukka/get-cmake@latest
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r26d }

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Aether core
        working-directory: ext/Aether/aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t ${{ matrix.abi }} --platform 24 build --release

      - name: Build ByeDPI desync engine
        working-directory: ext/byedpi
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          make CC=$TC/${{ matrix.cc }} LDFLAGS="-static-libgcc"

      # Upstream's own Android CI builds the JNI-ready .so with ndk-build
      # (Android.mk, APP_MODULES=hev-socks5-tunnel). That is the build that
      # carries JNI_OnLoad + the TProxyService RegisterNatives bindings the
      # app relies on; a plain `make shared` binary would not load.
      - name: Build hev-socks5-tunnel (JNI-ready .so)
        working-directory: ext/hev-socks5-tunnel
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          "$ANDROID_NDK_HOME/ndk-build" APP_ABI=${{ matrix.abi }} \
            APP_MODULES=hev-socks5-tunnel -j$(nproc)
          find libs -name '*.so' -exec ls -la {} \;

      # Android only extracts files named lib*.so, hence the rename
      - name: Stage jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/${{ matrix.abi }}
          cp ext/Aether/aether/target/${{ matrix.rust }}/release/aether \
             app/src/main/jniLibs/${{ matrix.abi }}/libonvocore.so
          cp ext/byedpi/ciadpi \
             app/src/main/jniLibs/${{ matrix.abi }}/libonvodesync.so
          # System.loadLibrary("hevsocks5") resolves to libhevsocks5.so
          BRIDGE=$(find ext/hev-socks5-tunnel/libs -name 'libhev-socks5-tunnel.so' | head -1)
          if [ -n "$BRIDGE" ]; then
            cp "$BRIDGE" app/src/main/jniLibs/${{ matrix.abi }}/libhevsocks5.so
          else
            echo "::error::bridge library was not produced for ${{ matrix.abi }}"
            exit 1
          fi
          chmod +x app/src/main/jniLibs/${{ matrix.abi }}/*.so
          ls -la app/src/main/jniLibs/${{ matrix.abi }}/

      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs-${{ matrix.abi }}
          path: app/src/main/jniLibs/${{ matrix.abi }}/*.so
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Assemble the APK. R8 needs several GB, which is exactly why release
  # builds happen here and not in the dev sandbox.
  # ---------------------------------------------------------------------
  apk:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jniLibs-*
          path: staging

      - name: Place native libraries
        run: |
          for d in staging/jniLibs-*; do
            abi="${d#staging/jniLibs-}"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$d"/*.so "app/src/main/jniLibs/$abi/"
          done
          find app/src/main/jniLibs -name '*.so' -exec ls -la {} \;

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}

      - name: Restore CI-sized memory
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          sed -i '/^android.r8.maxWorkers=/d;/^kotlin.compiler.execution.strategy=/d;/^org.gradle.parallel=/d' gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > onvo-release.jks

      - name: Build release APKs (R8 + resource shrinking)
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        env:
          ONVO_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ONVO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ONVO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # A silent miss here produces an APK that installs, opens, and can never
      # connect — which is indistinguishable from censorship on the device.
      - name: Verify native payload is inside the APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name '*universal*.apk' | head -1)
          [ -n "$APK" ] || APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "inspecting $APK"
          unzip -l "$APK" | grep -E 'lib/.*\.so' || true
          for want in libonvocore.so libonvodesync.so libhevsocks5.so; do
            if unzip -l "$APK" | grep -q "$want"; then
              echo "  ok   $want"
            else
              echo "::error::$want is missing from the APK"
              exit 1
            fi
          done

      - name: Checksums
        run: cd app/build/outputs/apk && find . -name '*.apk' -exec sha256sum {} \; | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: onvo-apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
          generate_release_notes: true
